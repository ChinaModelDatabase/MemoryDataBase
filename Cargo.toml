[workspace]
resolver = "2"
members = [
    "crates/jx-proto",
    "crates/jx-engine",
    "crates/jx-persist",
    "crates/jx-crypto",
    "crates/jx-server",
    "crates/jx-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
bytes = "1"
crossbeam-channel = "0.5"
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sm3 = "0.4"
sm4 = "0.5"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
